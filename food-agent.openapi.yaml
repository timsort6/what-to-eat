openapi: 3.1.0
info:
  title: food-agent
  description: food-agent web server API (M0/M1/M2)
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: 探活
  - name: 认证
  - name: 常用地址
  - name: Agent
paths:
  /api/v1/ping:
    get:
      summary: Ping
      deprecated: false
      description: 探活接口
      operationId: ping
      tags:
        - 探活
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                api_version: v1
                code: 200
                message: success
                data:
                  message: pong
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
      security: []
      x-apifox-folder: 探活
      x-apifox-status: released

  /api/v1/healthz:
    get:
      summary: Healthz
      deprecated: false
      description: 健康检查
      operationId: healthz
      tags:
        - 探活
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                api_version: v1
                code: 200
                message: success
                data:
                  status: ok
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
      security: []
      x-apifox-folder: 探活
      x-apifox-status: released

  /api/v1/readyz:
    get:
      summary: Readyz
      deprecated: false
      description: 就绪检查
      operationId: readyz
      tags:
        - 探活
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                api_version: v1
                code: 200
                message: success
                data:
                  status: ok
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
      security: []
      x-apifox-folder: 探活
      x-apifox-status: released

  /api/v1/auth/register:
    post:
      summary: Register
      deprecated: false
      description: 用户注册（用户名仅允许英文/数字/下划线；密码强度至少 Moderate）
      operationId: authRegister
      tags:
        - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: test_user
              password: Abcd1234!
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                api_version: v1
                code: 200
                message: success
                data:
                  id: 1
                  username: test_user
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers: {}
          x-apifox-name: 参数错误
          x-apifox-ordering: 1
      security: []
      x-apifox-folder: 认证
      x-apifox-status: released

  /api/v1/auth/login:
    post:
      summary: Login
      deprecated: false
      description: 用户登录，返回 JWT token
      operationId: authLogin
      tags:
        - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: test_user
              password: Abcd1234!
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                api_version: v1
                code: 200
                message: success
                data:
                  token: "<jwt>"
                  expires_in_seconds: 86400
                  user:
                    id: 1
                    username: test_user
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers: {}
          x-apifox-name: 未授权
          x-apifox-ordering: 1
      security: []
      x-apifox-folder: 认证
      x-apifox-status: released

  /api/v1/me:
    get:
      summary: Me
      deprecated: false
      description: 获取当前登录用户信息，需要在 Authorization header 中提供 Bearer token
      operationId: me
      tags:
        - 认证
      parameters:
        - name: Authorization
          in: header
          description: Bearer token
          example: Bearer <token>
          schema:
            type: string
            default: Bearer <token>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                api_version: v1
                code: 200
                message: success
                data:
                  id: 1
                  username: test_user
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers: {}
          x-apifox-name: 未授权
          x-apifox-ordering: 1
      security: []
      x-apifox-folder: 认证
      x-apifox-status: released

  /api/v1/addresses:
    post:
      summary: CreateAddress
      deprecated: false
      description: 创建常用地址（鉴权）；若是用户的第一个地址则强制设为默认地址
      operationId: createAddress
      tags:
        - 常用地址
      parameters:
        - name: Authorization
          in: header
          description: Bearer token
          example: Bearer <token>
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
            example:
              label: 家
              location: "121.1,31.1"
              formatted_address: "上海市徐汇区..."
              amap_poi:
                id: "B0FF..."
                name: "XX小区"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      security: []
      x-apifox-folder: 常用地址
      x-apifox-status: released

    get:
      summary: ListAddresses
      deprecated: false
      description: 获取当前用户常用地址列表（鉴权）
      operationId: listAddresses
      tags:
        - 常用地址
      parameters:
        - name: Authorization
          in: header
          description: Bearer token
          example: Bearer <token>
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      security: []
      x-apifox-folder: 常用地址
      x-apifox-status: released

  /api/v1/addresses/{id}:
    put:
      summary: UpdateAddress
      deprecated: false
      description: 更新常用地址（鉴权）；仅支持设默认（is_default=true）
      operationId: updateAddress
      tags:
        - 常用地址
      parameters:
        - name: Authorization
          in: header
          description: Bearer token
          example: Bearer <token>
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
            example:
              label: 公司
              is_default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      security: []
      x-apifox-folder: 常用地址
      x-apifox-status: released

    delete:
      summary: DeleteAddress
      deprecated: false
      description: 删除常用地址（鉴权）；若删除的是默认地址，则自动迁移默认到最小 id
      operationId: deleteAddress
      tags:
        - 常用地址
      parameters:
        - name: Authorization
          in: header
          description: Bearer token
          example: Bearer <token>
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      security: []
      x-apifox-folder: 常用地址
      x-apifox-status: released

  /api/v1/agent/chat:
    post:
      summary: AgentChat
      deprecated: false
      description: Agent chat（SSE 流式输出），返回 answer_text 增量与最终 places
      operationId: agentChat
      tags:
        - Agent
      parameters:
        - name: Authorization
          in: header
          description: Bearer token
          example: Bearer <token>
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              messages:
                - role: user
                  content: "附近有什么好吃的？"
              location: "121.1,31.1"
              radius: 5000
              sortrule: distance
              limit: 10
      responses:
        '200':
          description: OK (SSE)
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: delta
                data: {"text":"..."}

                event: done
                data: {"answer_text":"...","places_count":10,"places":[...]}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      security: []
      x-apifox-folder: Agent
      x-apifox-status: released

components:
  schemas:
    Envelope:
      type: object
      properties:
        api_version:
          type: string
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
      required:
        - api_version
        - code
        - message
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    Address:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        is_default:
          type: boolean
        amap_id:
          type: string
        name:
          type: string
        type:
          type: string
        typecode:
          type: string
        tel:
          type: string
        tag:
          type: string
        formatted_address:
          type: string
        address:
          type: string
        location:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        pname:
          type: string
        cityname:
          type: string
        adname:
          type: string
        citycode:
          type: string
        adcode:
          type: string
        amap_poi:
          description: AMap POI raw json (object)
          nullable: true
      required:
        - id
        - label
        - is_default
        - location
        - longitude
        - latitude

    CreateAddressRequest:
      type: object
      properties:
        label:
          type: string
        is_default:
          type: boolean
        amap_id:
          type: string
        name:
          type: string
        type:
          type: string
        typecode:
          type: string
        tel:
          type: string
        tag:
          type: string
        formatted_address:
          type: string
        address:
          type: string
        location:
          type: string
        pname:
          type: string
        cityname:
          type: string
        adname:
          type: string
        citycode:
          type: string
        adcode:
          type: string
        amap_poi:
          nullable: true
      required:
        - label
        - location

    UpdateAddressRequest:
      type: object
      properties:
        label:
          type: string
        is_default:
          type: boolean
        amap_id:
          type: string
        name:
          type: string
        type:
          type: string
        typecode:
          type: string
        tel:
          type: string
        tag:
          type: string
        formatted_address:
          type: string
        address:
          type: string
        location:
          type: string
        pname:
          type: string
        cityname:
          type: string
        adname:
          type: string
        citycode:
          type: string
        adcode:
          type: string
        amap_poi:
          nullable: true

    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
      required:
        - role
        - content

    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        address_id:
          type: integer
          nullable: true
        location:
          type: string
        keywords:
          type: string
        types:
          type: string
        radius:
          type: integer
        sortrule:
          type: string
        region:
          type: string
        city_limit:
          type: boolean
          nullable: true
        limit:
          type: integer
      required:
        - messages

    Place:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        address:
          type: string
        distance:
          type: string
        type:
          type: string
        typecode:
          type: string
        pname:
          type: string
        cityname:
          type: string
        adname:
          type: string
        citycode:
          type: string
        adcode:
          type: string
        tel:
          type: string
        tag:
          type: string
        raw:
          nullable: true

    DoneData:
      type: object
      properties:
        answer_text:
          type: string
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        places_count:
          type: integer
        location:
          type: string
        address_id:
          type: integer
          nullable: true
      required:
        - answer_text
        - places
        - places_count
